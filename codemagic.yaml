# ChoreLock iOS builds via Codemagic (no Mac required).
#
# Codemagic setup (once): Teams → Integrations → App Store Connect API key named "Codemagic CI"
# Variable groups: "chorelock" (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY) and "ios_signing" (CERTIFICATE_PRIVATE_KEY, secure —
# same RSA key as the SpringFed app so the one distribution certificate is shared).
#
# ios-dev:        development-signed IPA for direct install on registered devices (works with the
#                 Family Controls *development* entitlement — use this until Apple approves distribution).
# ios-testflight: App Store signing → TestFlight (requires Family Controls distribution approval).

definitions:
  env: &env
    groups: [chorelock, ios_signing]
    vars:
      BUNDLE_ID: app.chorelock
      XCODE_PROJECT: ios/App/App.xcodeproj
      XCODE_SCHEME: App
      DEVELOPMENT_TEAM: XTDR638PA7
      MARKETING_VERSION: 0.1.0
    node: 24
    xcode: latest
  scripts:
    - &web
      name: Install & build web
      script: npm ci && npm run build
    - &ios_project
      name: Generate iOS project + native targets
      script: |
        rm -rf ios
        npx cap add ios
        npx cap sync ios
        gem install xcodeproj plist --no-document
        ruby scripts/ios-setup.rb
    - &version
      name: Stamp build number
      script: cd ios/App && agvtool new-version -all "$BUILD_NUMBER" || true
    - &build
      name: Build IPA
      script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

workflows:
  ios-dev:
    name: iOS dev build (direct install)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      <<: *env
    scripts:
      - *web
      - *ios_project
      - name: Signing (development)
        script: |
          for id in app.chorelock app.chorelock.ChoreLockShield app.chorelock.ChoreLockShieldAction app.chorelock.ChoreLockMonitor app.chorelock.ChoreLockComms; do
            app-store-connect fetch-signing-files "$id" --type IOS_APP_DEVELOPMENT --create
          done
          keychain initialize && keychain add-certificates && xcode-project use-profiles
      - *version
      - *build
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/App.xcodeproj/project.pbxproj

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      <<: *env
    scripts:
      - *web
      - *ios_project
      - name: Signing (App Store)
        script: |
          for id in app.chorelock app.chorelock.ChoreLockShield app.chorelock.ChoreLockShieldAction app.chorelock.ChoreLockMonitor app.chorelock.ChoreLockComms; do
            app-store-connect fetch-signing-files "$id" --type IOS_APP_STORE --create
          done
          keychain initialize && keychain add-certificates && xcode-project use-profiles
      - *version
      - *build
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only — the build reaches internal testers as soon as processing
        # finishes, no beta review needed. Set submit_to_testflight: true again
        # (and fill in ASC TestFlight Test Information) when external testers join.
        submit_to_testflight: false
